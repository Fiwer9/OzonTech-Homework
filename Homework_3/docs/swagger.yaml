basePath: /
definitions:
  cart.AddItemRequest:
    properties:
      count:
        example: 12
        type: integer
    type: object
  model.Cart:
    properties:
      items:
        items:
          $ref: '#/definitions/model.CartItem'
        type: array
      total_price:
        type: integer
    type: object
  model.CartItem:
    properties:
      count:
        type: integer
      name:
        type: string
      price:
        type: integer
      sku:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Сервис корзины пользователя
  title: Cart API
  version: "1.0"
paths:
  /user/{user_id}/cart:
    get:
      parameters:
      - description: Идентификатор пользователя
        example: 1007
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Cart'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Получить содержимое корзины
      tags:
      - cart
  /user/{user_id}/cart/{sku_id}:
    post:
      consumes:
      - application/json
      parameters:
      - description: Идентификатор пользователя
        example: 1007
        in: path
        name: user_id
        required: true
        type: integer
      - description: Идентификатор товара
        example: 1076963
        in: path
        name: sku_id
        required: true
        type: integer
      - description: Количество товара
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.AddItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "412":
          description: Precondition Failed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Добавить товар в корзину
      tags:
      - cart
swagger: "2.0"
